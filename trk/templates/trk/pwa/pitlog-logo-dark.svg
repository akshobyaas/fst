<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260">
  <title>PitLog — Log it. Own it.</title>

  <!-- ── LOGBOOK ── -->
  <!-- Back cover -->
  <rect x="18" y="28" width="112" height="150" rx="9" fill="none" stroke="#ffffff" stroke-width="4.5"/>
  <!-- Spine line -->
  <line x1="72" y1="28" x2="72" y2="178" stroke="#ffffff" stroke-width="3"/>
  <!-- Left page inner shadow line -->
  <rect x="24" y="34" width="46" height="138" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <!-- Bookmark -->
  <polygon points="70,178 80,200 90,178" fill="#ffffff"/>

  <!-- Fuel pump icon (left page) -->
  <rect x="30" y="52" width="15" height="20" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="37" y1="52" x2="37" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="37" y1="44" x2="45" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="44" x2="45" y2="54" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="45" cy="57" r="2" fill="#ffffff"/>
  <!-- Fuel lines -->
  <line x1="52" y1="57" x2="73" y2="57" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="66" x2="73" y2="66" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Wrench icon (left page) -->
  <path d="M30 100 Q26 94 28 87 Q33 79 40 82 L52 93 L47 98 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="48" y1="95" x2="57" y2="105" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wrench lines -->
  <line x1="62" y1="95" x2="78" y2="95" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="62" y1="104" x2="78" y2="104" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="62" y1="113" x2="74" y2="113" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Right page ruled lines -->
  <line x1="80" y1="55" x2="118" y2="55" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="65" x2="122" y2="65" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="75" x2="118" y2="75" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="95" x2="122" y2="95" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="105" x2="118" y2="105" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="115" x2="112" y2="115" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- ── PITLOG ROAD LETTERFORMS ── -->
  <!-- All letters: thick white stroke + white dashed centre line (road marking) -->

  <!-- P -->
  <path d="M142 48 L142 178" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M142 48 Q186 48 186 85 Q186 122 142 122" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" stroke-linejoin="round"/>
  <path d="M142 48 L142 178" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="9 7"/>
  <path d="M142 48 Q186 48 186 85 Q186 122 142 122" stroke="#000000" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="9 7"/>

  <!-- i dot -->
  <circle cx="210" cy="54" r="7.5" fill="#ffffff"/>
  <circle cx="210" cy="54" r="3.5" fill="#000000"/>
  <!-- i stem -->
  <line x1="210" y1="70" x2="210" y2="178" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <line x1="210" y1="70" x2="210" y2="178" stroke="#000000" stroke-width="3.5" stroke-dasharray="9 7" stroke-linecap="round"/>

  <!-- t -->
  <line x1="238" y1="34" x2="238" y2="178" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <line x1="220" y1="66" x2="258" y2="66" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <line x1="238" y1="34" x2="238" y2="178" stroke="#000000" stroke-width="3.5" stroke-dasharray="9 7" stroke-linecap="round"/>
  <line x1="220" y1="66" x2="258" y2="66" stroke="#000000" stroke-width="3.5" stroke-dasharray="9 7" stroke-linecap="round"/>

  <!-- L -->
  <path d="M272 48 L272 168 Q272 178 282 178 L336 178" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" stroke-linejoin="round"/>
  <path d="M272 48 L272 168 Q272 178 282 178 L336 178" stroke="#000000" stroke-width="3.5" stroke-dasharray="9 7" stroke-linecap="round" fill="none"/>

  <!-- o -->
  <ellipse cx="372" cy="128" rx="28" ry="36" stroke="#ffffff" stroke-width="10" fill="none"/>
  <ellipse cx="372" cy="128" rx="28" ry="36" stroke="#000000" stroke-width="3.5" fill="none" stroke-dasharray="9 7"/>

  <!-- g -->
  <path d="M440 92 Q416 92 416 128 Q416 164 440 164 Q464 164 464 128 Q464 104 452 94" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" stroke-linejoin="round"/>
  <path d="M452 96 Q472 92 472 112 Q472 186 440 186 Q416 186 414 172" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M440 92 Q416 92 416 128 Q416 164 440 164 Q464 164 464 128 Q464 104 452 94" stroke="#000000" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="9 7"/>
  <path d="M452 96 Q472 92 472 112 Q472 186 440 186 Q416 186 414 172" stroke="#000000" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="9 7"/>

  <!-- Road underline beneath letters -->
  <line x1="138" y1="196" x2="490" y2="196" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="138" y1="196" x2="490" y2="196" stroke="#000000" stroke-width="2" stroke-dasharray="12 9" stroke-linecap="round"/>

  <!-- ── TAGLINE ── -->
  <text x="314" y="238" text-anchor="middle"
    font-family="'DM Sans', 'Inter', Arial, sans-serif"
    font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1.5">
    Log it. Own it.
  </text>
</svg>
