<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>PitLog</title>
  <!-- Dark bg pill -->
  <rect width="64" height="64" rx="14" fill="#111111"/>
  <!-- Logbook outline -->
  <rect x="6" y="10" width="24" height="30" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="18" y1="10" x2="18" y2="40" stroke="#ffffff" stroke-width="1.5"/>
  <!-- bookmark -->
  <polygon points="17,40 21,46 25,40" fill="#ffffff"/>
  <!-- fuel pump tiny -->
  <rect x="8" y="15" width="5" height="7" rx="1" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="10" y1="15" x2="10" y2="12" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="12" x2="13" y2="12" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- lines right page -->
  <line x1="21" y1="17" x2="27" y2="17" stroke="#ffffff" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <line x1="21" y1="21" x2="27" y2="21" stroke="#ffffff" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <line x1="21" y1="25" x2="25" y2="25" stroke="#ffffff" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <!-- P letterform road -->
  <path d="M34 10 L34 44" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M34 10 Q50 10 50 22 Q50 34 34 34" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M34 10 L34 44" stroke="#111" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
  <path d="M34 10 Q50 10 50 22 Q50 34 34 34" stroke="#111" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" fill="none"/>
  <!-- underline road -->
  <line x1="32" y1="50" x2="58" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="58" y2="50" stroke="#111" stroke-width="1.2" stroke-dasharray="6 5"/>
</svg>
